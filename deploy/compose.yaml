# Readyline production stack: the app behind Caddy (automatic HTTPS, TLS 1.3, post-quantum key
# exchange). Run from the repository root, with .env.production there (see README):
#
#   docker compose -f deploy/compose.yaml --env-file .env.production up -d --build
#
# --env-file lets Compose read APP_URL, APP_DOMAIN and the build arguments from the same file the
# app gets through env_file. Only Caddy publishes ports; the app is reachable only from Caddy.
#
# Scheduled jobs: call the two cron endpoints from the host's crontab. Put the CRON_SECRET line
# at the top of the crontab (same value as in .env.production) and use your own domain:
#
#   CRON_SECRET=paste-the-value-from-.env.production
#   17 * * * * curl -fsS --max-time 300 -X POST -H "Authorization: Bearer $CRON_SECRET" https://app.example.com/api/cron/sbom-watch/ > /dev/null
#   41 6 * * * curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" https://app.example.com/api/cron/billing/ > /dev/null
#
# sbom-watch (hourly) re-checks every stored SBOM against OSV and emails owners and admins about
# new critical and high findings. billing (daily) sends renewal reminders and ends lapsed plans.
# Keep the trailing slash: the site uses trailing slashes and would otherwise redirect the POST.

name: readyline

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_URL: ${APP_URL:?Set APP_URL in .env.production and pass --env-file .env.production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${APP_URL}}
    image: readyline-app:latest
    restart: unless-stopped
    init: true
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      # Caddy is the one proxy in front of the app.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - readyline-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "3000"

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production and pass --env-file .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  # Holds readyline.db (SQLite, WAL mode). Back it up together with the keys.
  readyline-data:
  # Holds Caddy's TLS certificates and ACME account; keep it to avoid CA rate limits on rebuilds.
  caddy_data:
  caddy_config:
